name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessário para criar a "Release" com os APKs
permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          V=$(grep -m1 "versionName" app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "VERSAO=$V" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/box/release/app-box-release.apk "out/tvhome-box-$V.apk"
          cp app/build/outputs/apk/tcl/release/app-tcl-release.apk "out/tvhome-tcl-$V.apk"
          cp app/build/outputs/apk/fire/release/app-fire-release.apk "out/tvhome-fire-$V.apk"
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk "out/tvhome-tablet-$V.apk"
          ls -la out

      # Os APKs vão para "Releases" em vez de "Artifacts": não gastam a cota de
      # artifacts do Actions (que é da conta inteira) e ficam guardados.
      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v${{ env.VERSAO }}-${{ github.run_number }}
          name: TV Launcher ${{ env.VERSAO }}
          files: out/*.apk
