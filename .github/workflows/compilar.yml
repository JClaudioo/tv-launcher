name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          cp app/build/outputs/apk/box/release/app-box-release.apk tvhome-box.apk
          cp app/build/outputs/apk/tcl/release/app-tcl-release.apk tvhome-tcl.apk
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk tvhome-tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-box
          path: tvhome-box.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-tcl
          path: tvhome-tcl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-tablet
          path: tvhome-tablet.apk
