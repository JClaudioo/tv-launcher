plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joao.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.joao.tvhome'
        minSdk 26
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }

    // Assinatura fixa: assim cada nova versão instala por cima da anterior sem desinstalar.
    signingConfigs {
        fixa {
            storeFile file('assinatura.jks')
            storePassword 'tvhome123'
            keyAlias 'tvhome'
            keyPassword 'tvhome123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
        debug {
            signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
