plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joao.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.joao.tvhome'
        minSdk 26
        targetSdk 30
        versionCode 6
        versionName '1.4'
    }

    // Assinatura fixa: assim cada nova versão instala por cima da anterior sem desinstalar.
    signingConfigs {
        fixa {
            storeFile file('assinatura.jks')
            storePassword 'tvhome123'
            keyAlias 'tvhome'
            keyPassword 'tvhome123'
        }
    }

    // Duas TVs, um código só: o que é comum fica em src/main; o que é de cada TV, em src/box e src/tcl
    flavorDimensions 'tv'
    productFlavors {
        box {
            dimension 'tv'
            // Mi Box: mesmo pacote de antes, instala por cima da versão atual
            applicationId 'com.joao.tvhome'
        }
        tcl {
            dimension 'tv'
            // TV TCL (Google TV)
            applicationId 'com.joao.tvhome.tcl'
        }
        tablet {
            dimension 'tv'
            // Tablet da criança (Galaxy Tab 2, Android 6)
            applicationId 'com.joao.tvhome.tablet'
            minSdk 23
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
        debug {
            signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
